<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Superpowers Visual Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    :root {
      --bg: #f3f4f6;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-strong: #ffffff;
      --surface-muted: #eef1f4;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.14);
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #94a3b8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --accent-soft: rgba(15, 118, 110, 0.1);
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --surface: rgba(15, 23, 42, 0.82);
        --surface-strong: #0f172a;
        --surface-muted: #111827;
        --border: rgba(148, 163, 184, 0.16);
        --border-strong: rgba(148, 163, 184, 0.28);
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --text-faint: #64748b;
        --accent: #2dd4bf;
        --accent-strong: #5eead4;
        --accent-soft: rgba(45, 212, 191, 0.12);
        --success: #4ade80;
        --warning: #fbbf24;
        --danger: #f87171;
        --shadow: 0 18px 48px rgba(2, 6, 23, 0.45);
      }
    }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.08), transparent 22rem),
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.06), transparent 18rem),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      line-height: 1.45;
    }

    .header {
      backdrop-filter: blur(16px);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .brand-mark {
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
      flex-shrink: 0;
    }
    .brand-copy { min-width: 0; }
    .brand-copy h1 {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-copy p {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .status {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 22%, var(--border));
      background: color-mix(in srgb, var(--success) 8%, var(--surface-strong));
    }
    @supports not (background: color-mix(in srgb, red 10%, white)) {
      .status {
        background: var(--surface-strong);
      }
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .workspace {
      max-width: 1440px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .workspace-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .workspace-title {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .workspace-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    #claude-content {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 20px;
      padding: 1.5rem;
      min-height: 100%;
    }

    .indicator-bar {
      backdrop-filter: blur(16px);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      flex-shrink: 0;
      text-align: center;
    }
    .indicator-bar span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .indicator-bar .selected-text {
      color: var(--accent);
      font-weight: 700;
    }

    h2 { font-size: clamp(1.4rem, 2vw, 2rem); font-weight: 800; margin-bottom: 0.45rem; letter-spacing: 0; }
    h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; letter-spacing: 0; }
    h4 { font-size: 0.82rem; font-weight: 700; }
    p { color: var(--text-muted); }
    .subtitle { color: var(--text-muted); margin-bottom: 1.25rem; max-width: 62rem; }
    .section { margin-bottom: 2rem; }
    .label { font-size: 0.7rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; font-weight: 700; }

    .options { display: flex; flex-direction: column; gap: 0.75rem; }
    .option {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
    }
    .option:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }
    .option.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .option .letter {
      background: var(--surface-muted);
      color: var(--text-muted);
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .option.selected .letter { background: var(--accent); color: white; }
    .option .content { flex: 1; }
    .option .content h3 { font-size: 0.95rem; margin-bottom: 0.15rem; }
    .option .content p { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08); }
    .card.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .card-image { background: linear-gradient(180deg, var(--surface-muted), transparent 65%); aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card-body { padding: 1rem; }
    .card-body h3 { margin-bottom: 0.25rem; }
    .card-body p { color: var(--text-muted); font-size: 0.85rem; }

    .mockup {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .mockup-header {
      background: var(--surface-muted);
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    .mockup-body { padding: 1.5rem; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 700px) { .split { grid-template-columns: 1fr; } }

    .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
    .pros, .cons { background: var(--surface-strong); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .pros h4 { color: var(--success); font-size: 0.85rem; margin-bottom: 0.5rem; }
    .cons h4 { color: var(--danger); font-size: 0.85rem; margin-bottom: 0.5rem; }
    .pros ul, .cons ul { margin-left: 1.25rem; font-size: 0.85rem; color: var(--text-muted); }
    .pros li, .cons li { margin-bottom: 0.25rem; }

    .placeholder {
      background: var(--surface-muted);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      color: var(--text-faint);
    }

    .mock-nav {
      background: var(--text);
      color: white;
      padding: 0.85rem 1rem;
      display: flex;
      gap: 1rem;
      font-size: 0.86rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .mock-sidebar {
      background: var(--surface-muted);
      padding: 1rem;
      min-width: 200px;
      border-right: 1px solid var(--border);
    }
    .mock-content { padding: 1.5rem; flex: 1; }
    .mock-button {
      background: var(--text);
      color: white;
      border: none;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .mock-input {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.8rem;
      width: 100%;
      color: var(--text);
    }
    .panel, .metric {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    .metric-grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .metric .value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-top: 0.35rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      border-radius: 999px;
      padding: 0.4rem 0.7rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .table th,
    .table td {
      text-align: left;
      padding: 0.8rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .table th {
      color: var(--text-faint);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .table td {
      color: var(--text-muted);
    }

    @media (max-width: 720px) {
      .header,
      .main,
      .indicator-bar {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      #claude-content {
        padding: 1rem;
        border-radius: 16px;
      }
      .pros-cons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-copy">
        <h1><a href="https://github.com/obra/superpowers" style="color: inherit; text-decoration: none;">Superpowers Visual Companion</a></h1>
        <p>Fast UI review frame for comparisons, flows, and product mockups</p>
      </div>
    </div>
    <div class="header-meta">
      <div class="pill">Preview</div>
      <div class="pill status">Connected</div>
    </div>
  </div>

  <div class="main">
    <div class="workspace">
      <div class="workspace-bar">
        <div class="workspace-title">Review Surface</div>
        <div class="workspace-hint">Use this frame for discussion. Build final deliverables in a real app shell.</div>
      </div>
      <div id="claude-content">
        <!-- CONTENT -->
      </div>
    </div>
  </div>

  <div class="indicator-bar">
    <span id="indicator-text">Click an option above, then return to the terminal</span>
  </div>

</body>
</html>
